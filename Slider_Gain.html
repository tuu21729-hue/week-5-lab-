<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>ARRRGH!</title>
    </head>
<body>

    <input id = "gain" type="range" min="0" max="1" step="0.01" value="0.2"><label id="gainDisplay">0.2</label>
    <script>
        const ctx = new AudioContext();
        ctx.suspend();

        const osc = new OscillatorNode(ctx);
        const gain = new GainNode(ctx);
        gain.gain.value = 0.2;

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

        const slider = document.querySelector("#gain");
        slider.addEventListener("input", () => {
            ctx.resume();
        gain.gain.value = Number(slider.value);
        document.querySelector("gainDisplay").textContent = slider.value;
    });
    </script>

    </body>
    </html>
